mqtt:
  host: "localhost"
  port: 1883

base:
  lat: 43.07470
  lon: -89.38420

simulator:
  num_drones: 2  # дефолт если лаунчер не передал N (legacy run_system.py)
  model: "none"
  home:
    lat: 43.0747
    lon: -89.3842
    alt: 0.0

# Список из 10 заготовленных дронов. Лаунчер берёт первые N штук
# (cfg["drones"][:N]) согласно слайдеру 1..10. Home-позиции разнесены
# в сетку 4×3 с шагом ~12м (1.5e-4 град), чтобы дроны не сливались
# в одну точку на карте.
#
# Порты:
#   mavlink_out = 14540 + i  (PX4 шлёт активно через mavlink start -o)
#   gRPC       = 50151 + i  (mavsdk_server каждого bridge'а)
#   instance   = i           (PX4 -i N для multi-drone)
drones:
  - id: 0
    name: "sim_drone_1"
    px4_path: "PX4-Autopilot"
    udp_port: 14540
    mavlink_out: 14540
    instance: 0
    home_lat: 43.07455
    home_lon: -89.384425

