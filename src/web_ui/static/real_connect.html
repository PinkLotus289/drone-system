<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drone Ops · Connect Real Drone</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/style.css?v=3" />
  <link rel="stylesheet" href="/static/launcher.css?v=1" />
  <link rel="stylesheet" href="/static/real_connect.css?v=1" />
</head>
<body class="launcher-body">

<header class="topbar">
  <div class="brand">
    <a href="/" style="display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="3" fill="currentColor"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <div class="brand-text">
        <div class="brand-title">DRONE OPS</div>
        <div class="brand-sub">REAL CONNECT</div>
      </div>
    </a>
  </div>
  <div class="topbar-spacer"></div>
  <a href="/" class="btn btn-ghost" style="text-decoration:none">← К лаунчеру</a>
</header>

<div class="real-warn-banner mono">
  ⚠ REAL DRONE MODE · команды и арминг будут управлять физическим бортом
</div>

<main class="real-main">

  <!-- Левая панель: список профилей -->
  <aside class="real-sidebar">
    <div class="panel-head">
      <span>SAVED PROFILES</span>
      <span class="panel-count mono" id="profile-count">0</span>
    </div>
    <div class="profile-list" id="profile-list">
      <div class="profile-empty">пусто — создайте профиль справа</div>
    </div>
    <button class="btn btn-ghost" id="btn-new-profile" style="margin-top:12px">+ Новый профиль</button>
  </aside>

  <!-- Правая панель: форма + test connection -->
  <section class="real-content">

    <div class="content-card">
      <div class="content-card-head">
        <div>
          <div class="card-tag" style="color:var(--orange)">CONNECTION SETUP</div>
          <div class="content-card-title" id="form-title">Подключение нового борта</div>
        </div>
        <div class="content-card-actions">
          <button class="btn btn-ghost hidden" id="btn-delete-profile">🗑 Удалить</button>
        </div>
      </div>

      <form class="real-form" id="real-form" autocomplete="off">

        <div class="form-row">
          <label>Имя профиля
            <span class="hint">только латиница, цифры, _ и -</span>
          </label>
          <input type="text" id="f-name" required maxlength="40" placeholder="x500_main" pattern="[a-zA-Z0-9_\-]{1,40}" />
        </div>

        <div class="form-row">
          <label>Отображаемое имя</label>
          <input type="text" id="f-display" placeholder="X500 (основной)" />
        </div>

        <div class="form-row">
          <label>Тип канала</label>
          <div class="seg">
            <button type="button" class="seg-btn active" data-conn="serial">Serial</button>
            <button type="button" class="seg-btn" data-conn="udp">UDP</button>
            <button type="button" class="seg-btn" data-conn="tcp">TCP</button>
          </div>
        </div>

        <!-- SERIAL -->
        <div class="form-block" id="block-serial">
          <div class="form-row">
            <label>Serial port
              <button type="button" class="link-btn" id="btn-reload-ports">↻ обновить</button>
            </label>
            <select id="f-serial-port">
              <option value="">— нет доступных портов —</option>
            </select>
            <span class="hint" id="port-hint"></span>
          </div>
          <div class="form-row">
            <label>Baud rate</label>
            <div class="seg" id="baud-seg">
              <button type="button" class="seg-btn active" data-baud="57600">57600 (SiK)</button>
              <button type="button" class="seg-btn" data-baud="115200">115200</button>
              <button type="button" class="seg-btn" data-baud="921600">921600 (USB-C)</button>
              <button type="button" class="seg-btn" data-baud="custom">custom</button>
            </div>
            <input type="number" id="f-baud-custom" class="hidden" placeholder="custom baud" />
          </div>
        </div>

        <!-- UDP/TCP -->
        <div class="form-block hidden" id="block-net">
          <div class="form-row two-col">
            <div>
              <label>Host</label>
              <input type="text" id="f-net-host" placeholder="0.0.0.0 или IP" />
            </div>
            <div>
              <label>Port</label>
              <input type="number" id="f-net-port" placeholder="14550" />
            </div>
          </div>
        </div>

        <div class="form-divider">Описание борта</div>

        <div class="form-row two-col">
          <div>
            <label>Frame</label>
            <input type="text" id="f-frame" value="X500" />
          </div>
          <div>
            <label>Battery cells (S)</label>
            <input type="number" id="f-cells" value="4" min="2" max="14" />
          </div>
        </div>

        <div class="form-row">
          <label>Min voltage (alert порог, V)</label>
          <input type="number" step="0.1" id="f-vmin" value="14.0" />
        </div>

        <div class="form-row">
          <label>Notes</label>
          <textarea id="f-notes" rows="2" placeholder="любые заметки про этот борт"></textarea>
        </div>

      </form>

      <div class="form-actions">
        <button class="btn btn-primary" id="btn-test-conn">🔌 Test Connection</button>
        <button class="btn" id="btn-save" disabled title="доступно после успешного теста">💾 Сохранить профиль</button>
      </div>
    </div>

    <!-- Результаты теста -->
    <div class="content-card hidden" id="test-results-card">
      <div class="content-card-head">
        <div>
          <div class="card-tag">PRE-FLIGHT CHECK</div>
          <div class="content-card-title">Результаты проверки</div>
        </div>
        <div class="content-card-actions mono small" id="test-meta"></div>
      </div>

      <div class="check-grid" id="check-grid">
        <!-- заполняется JS -->
      </div>

      <pre class="raw-result mono" id="raw-result"></pre>
    </div>

  </section>
</main>

<script src="/static/real_connect.js?v=1"></script>
</body>
</html>
