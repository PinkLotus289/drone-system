<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skybite · Local Launch</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/launcher.css?v=3" />
  <link rel="stylesheet" href="/static/real_connect.css?v=6" />
  <style>
    .ll-main { max-width: 560px; margin: 40px auto; padding: 0 20px; }
    .ll-card { background: var(--paper); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 26px 28px; }
    .ll-title { font-weight: 700; font-size: 18px; color: var(--ink-0); margin-bottom: 4px; }
    .ll-sub { color: var(--ink-3); font-size: 12px; margin-bottom: 22px; }
    .ll-l { display: block; font: 700 9px 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 14px 0 6px; }
    .ll-select { width: 100%; padding: 10px 12px; border: 1px solid var(--rule); background: var(--paper); font: 600 13px 'IBM Plex Sans', sans-serif; }
    .ll-summary { margin-top: 8px; padding: 8px 10px; background: var(--paper-tint, #eef1f5); border: 1px solid var(--hairline); font-size: 11px; color: var(--ink-2); }
    .ll-actions { display: flex; gap: 10px; margin-top: 20px; }
    .ll-actions .btn { flex: 1; }
    .ll-result { margin-top: 16px; font-size: 12px; }
    .ll-check { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--hairline); }
    .ll-check .ok { color: var(--success, #166534); font-weight: 700; }
    .ll-check .bad { color: var(--error, #b91c1c); font-weight: 700; }
    .ll-live { margin-top: 16px; padding: 12px; border: 1px solid var(--success, #166534); background: #f0f9f1; }
    .ll-live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font: 700 11px 'IBM Plex Mono', monospace; color: var(--ink-1); }
    .ll-empty { color: var(--ink-3); font-style: italic; padding: 10px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="launcher-body">

<header class="topbar">
  <a href="/" class="back-link">← Back to menu</a>
  <div class="brand" style="padding-left:16px;border-left:1px solid var(--hairline)">
    <div class="brand-glyph">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="3" fill="currentColor"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">Local launch</div>
      <div class="brand-sub">quick connect from saved</div>
    </div>
  </div>
  <div class="topbar-spacer"></div>
  <a href="/real" class="back-link">Manage connections →</a>
</header>

<main class="ll-main">
  <div class="ll-card">
    <div class="ll-title">Quick launch</div>
    <div class="ll-sub">Pick a saved connection, verify the link, and connect.</div>

    <label class="ll-l" for="ll-profile">Saved connection</label>
    <select id="ll-profile" class="ll-select">
      <option value="">— loading… —</option>
    </select>
    <div class="ll-summary mono" id="ll-summary">—</div>

    <div class="ll-actions">
      <button class="btn" id="ll-test">🔌 Test connection</button>
      <button class="btn btn-primary" id="ll-connect" disabled title="Run a successful test first">▶ Connect &amp; launch</button>
    </div>

    <div class="ll-result" id="ll-result"></div>

    <div class="ll-live hidden" id="ll-live">
      <div style="font:700 9px monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px">● Connected · live</div>
      <div class="ll-live-grid" id="ll-live-grid"></div>
      <div class="ll-actions">
        <button class="btn" id="ll-disconnect">Disconnect</button>
        <a href="/sim" class="btn btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">Open dashboard →</a>
      </div>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let profiles = {};
  let liveTimer = null;

  async function loadProfiles() {
    const r = await fetch("/api/real/profiles");
    if (r.status === 401) { location.href = "/login"; return; }
    const j = await r.json();
    const sel = $("ll-profile");
    profiles = {};
    (j.profiles || []).forEach((p) => { profiles[p.name] = p; });
    const names = Object.keys(profiles);
    if (names.length === 0) {
      sel.innerHTML = '<option value="">— no saved connections —</option>';
      $("ll-summary").textContent = "Create one in “Manage connections”.";
      return;
    }
    sel.innerHTML = names.map((n) => `<option value="${n}">${profiles[n].display_name || n}</option>`).join("");
    onSelect();
  }

  function summary(p) {
    if (!p) return "—";
    if (p.connection_type === "serial") return `serial · ${p.serial_port || "?"} @ ${p.serial_baud}`;
    return `${p.connection_type} · ${p.net_host || "0.0.0.0"}:${p.net_port}`;
  }

  function onSelect() {
    const p = profiles[$("ll-profile").value];
    $("ll-summary").textContent = summary(p);
    $("ll-result").innerHTML = "";
    $("ll-connect").disabled = true;
    stopLive();
    $("ll-live").classList.add("hidden");
  }

  async function testConn() {
    const p = profiles[$("ll-profile").value];
    if (!p) return;
    $("ll-test").disabled = true;
    $("ll-result").innerHTML = '<div class="ll-empty">Testing link… (up to ~12s)</div>';
    try {
      const r = await fetch("/api/real/test-connection", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          connection_type: p.connection_type, serial_port: p.serial_port, serial_baud: p.serial_baud,
          net_host: p.net_host, net_port: p.net_port,
        }),
      });
      const j = await r.json();
      const row = (l, ok, v) => `<div class="ll-check"><span>${l}</span><span class="${ok ? "ok" : "bad"}">${v}</span></div>`;
      let html = row("Heartbeat", j.heartbeat, j.heartbeat ? "OK" : "no link");
      if (j.gps) html += row("GPS", (j.gps.satellites || 0) >= 6, `${j.gps.satellites}🛰 ${j.gps.fix_type || ""}`);
      if (j.battery) html += row("Battery", true, `${(j.battery.voltage_v || 0).toFixed(1)}V`);
      if (j.health) html += row("Armable", j.health.armable, j.health.armable ? "yes" : "no");
      if (!j.ok) html += `<div class="ll-empty">${j.message || j.error || "link failed"}</div>`;
      $("ll-result").innerHTML = html;
      $("ll-connect").disabled = !j.ok;
    } catch (e) {
      $("ll-result").innerHTML = `<div class="ll-empty">error: ${e.message}</div>`;
    } finally {
      $("ll-test").disabled = false;
    }
  }

  async function connect() {
    const name = $("ll-profile").value;
    if (!name) return;
    $("ll-connect").disabled = true;
    const r = await fetch(`/api/real/connect/${encodeURIComponent(name)}`, { method: "POST" });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) { $("ll-result").innerHTML = `<div class="ll-empty">connect failed: ${j.error || r.status}</div>`; $("ll-connect").disabled = false; return; }
    $("ll-live").classList.remove("hidden");
    startLive(name);
  }

  async function disconnect() {
    const name = $("ll-profile").value;
    await fetch(`/api/real/disconnect/${encodeURIComponent(name)}`, { method: "POST" }).catch(() => {});
    stopLive();
    $("ll-live").classList.add("hidden");
    $("ll-connect").disabled = false;
  }

  function startLive(name) {
    const tick = async () => {
      try {
        const r = await fetch("/api/fleet");
        const j = await r.json();
        const d = (j.fleet || []).find((x) => x.id === "veh_" + name);
        const g = $("ll-live-grid");
        if (!d) { g.innerHTML = '<span class="ll-empty">waiting for heartbeat…</span>'; return; }
        const f = (v, u) => (v == null ? "—" : Number(v).toFixed(1) + u);
        g.innerHTML = `
          <span>STATUS ${d.status || "LINK"}</span><span>ALT ${f(d.alt, "m")}</span>
          <span>BAT ${d.battery_pct != null ? Math.round(d.battery_pct) + "%" : "—"}</span>
          <span>GPS ${d.sat_count != null ? d.sat_count + "🛰" : "—"}</span>
          <span style="grid-column:1/3">POS ${d.lat != null ? Number(d.lat).toFixed(5) + ", " + Number(d.lon).toFixed(5) : "—"}</span>`;
      } catch { /* silent */ }
    };
    tick();
    liveTimer = setInterval(tick, 2000);
  }
  function stopLive() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } }

  $("ll-profile").addEventListener("change", onSelect);
  $("ll-test").addEventListener("click", testConn);
  $("ll-connect").addEventListener("click", connect);
  $("ll-disconnect").addEventListener("click", disconnect);
  loadProfiles();
})();
</script>
</body>
</html>
